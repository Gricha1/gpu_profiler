services:
  gpu-profiler-init:
    image: gpu-profiler:local
    user: "0:0"
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /app/data /app/logs /app/runtime /app/config-local
        chown -R "${APP_UID:-1000}:${APP_GID:-1000}" /app/data /app/logs /app/runtime /app/config-local
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - gpu-profiler-config:/app/config-local

  gpu-profiler:
    build:
      context: .
      # The host may use a NetBird DNS resolver reachable only from its
      # loopback/overlay interface; use that resolver while building too.
      network: host
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: gpu-profiler:local
    container_name: gpu-profiler
    restart: unless-stopped
    network_mode: host
    depends_on:
      gpu-profiler-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      GPU_MONITOR_CONFIG_DIR: /app/config-local
      # A small ControllerServer must not start several expensive SSH probes
      # at once.
      GPU_MONITOR_SSH_MAX_ACTIVE: "1"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - gpu-profiler-config:/app/config-local
      - ${HOME}/.ssh:/home/app/.ssh:ro
  gpu-profiler-debug:
    # Developer UI is opt-in: `docker compose --profile debug up -d`.
    # Keeping it out of the normal stack saves memory on ControllerServer.
    profiles: ["debug"]
    build:
      context: .
      network: host
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: gpu-profiler:local
    container_name: gpu-profiler-debug
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    command: ["python", "-m", "uvicorn", "debug_app:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8001/ >/dev/null || exit 1"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./:/host-repo
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro

volumes:
  gpu-profiler-config:
