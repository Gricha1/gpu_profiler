services:
  gpu-profiler:
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: gpu-profiler:local
    container_name: gpu-profiler
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      GPU_MONITOR_CONFIG_DIR: /app/config-local
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - ./config/local:/app/config-local
      - ${HOME}/.ssh:/home/app/.ssh:ro
  gpu-profiler-debug:
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: gpu-profiler:local
    container_name: gpu-profiler-debug
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    command: ["python", "-m", "uvicorn", "debug_app:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8001/ >/dev/null || exit 1"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./:/host-repo
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
